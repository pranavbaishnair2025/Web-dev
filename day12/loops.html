<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    for(let i=0;i<5;i++){
      console.log(i)
    }

    let j = 0;
    while(j < 5){
      console.log(j)
      j++
    }

    let n=1
    do{
      console.log("do while")
      n++
    }while(n<5)
  </script>
</body>
</html>
