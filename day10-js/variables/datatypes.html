<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // string
    var city="mumbai"
    // number
    var num=1234
    
    console.log(typeof(city))
    console.log(typeof(num))

    // boolean
    var isloggedin=true
    console.log(typeof(isloggedin))

    var x
    console.log(typeof(x))

    var discount=null
    console.log(typeof(discount))
    // instead of null the word "object" is printed because of a bug in javascript
  </script>
</body>
</html>
