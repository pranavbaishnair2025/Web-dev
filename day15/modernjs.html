<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  //templete string - var or parameter along with text
  <script>
    var a="john"
    //old way
    console.log("my name is ",a)

    //new way
    console.log(`my name is ${a}`)

    //arrow function - function logic in one line
    //old way
    function xyz(){
      console.log("hello im old func")
    }
    xyz()
    //new way
    var abc=()=>{
      console.log("hello im arrow func")
    }
    abc()
  </script>
</body>
</html>
