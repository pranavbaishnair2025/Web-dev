<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <script>
    // arithmetic
    var x=10
    var y=9
    console.log(x+y)
    console.log(x-y)
    console.log(x*y)
    console.log(x/y)
    console.log(x%y)

    // assignment
    var a=10
    console.log(a+=5)

    // comparison
    console.log(x==y)
    console.log(x!=y)
    console.log(x>y)

    var t1=10
    var t2="10"
    console.log(t1==t2)
    console.log(t1===t2)

    // logical
    var ismember=false
    var totalbill=1500
    console.log(ismember && totalbill>=1000)
    console.log(ismember || totalbill>=1000)
    console.log(!ismember)
  </script>
</body>
</html>
