<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- table row has a tag but for columns it depends on how many entries u give -->
   <!-- th is for col name and td is for data  -->
    <!-- cellspacing adds space between boxes -->
     <!-- cellpadding adds space inside the box -->
   <table border="2px" cellspacing="10px" cellpadding="10px" bgcolor="lightblue">
    <thead align="centre" bgcolor="yellow">
    <tr></tr>
      <th>Name</th>
      <th>Course</th>
      <th>City</th>
    </thead>
    <tr></tr>
      <td>Pranav</td>
      <td>Computer Science</td>
      <td>Bangalore</td>
    <tr></tr>
      <td>Rohit</td>
      <td>Mechanical</td>
      <td>Delhi</td>
   </table>
</body>
</html>
