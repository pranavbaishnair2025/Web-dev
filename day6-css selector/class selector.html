<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .abc {
      color: red;
    }
  </style>
</head>
<body>
  <!-- id names cant be repeated but class names can be repeated -->
  <h2 class="abc">Web development</h2>
  <p class="abc">This is example of class selector</p>
  <button class="abc">Login</button>
  <p>different tags , same styling</p>
</body>
</html>
