<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    #note,.abc,h1{
      color: white;
       background-color: black;
    }

    div{
      background-color: bisque;
      height: 60px;
      width: 200px;
    }
    
    div h2{
      color: blue;
    }

    div p{
      color: brown;
    }

    div button{
      color: blue;
    }
  </style>
</head>
<body>
  <h2 class="abc">Web development</h2>
  <p id="note">This is example of class selector</p>
  <button class="xyz">Logout</button>
  <p>grouping</p>
  <h1>hello</h1>

  <div>
    <h2>Iphone</h2>
    <p>Rs 9999</p>
    <button>Buy Now</button>
  </div>
</body>
</html>
