<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- data list tag -->
  <label>City</label>
  <input list="cities" placeholder="Select a city">  
  <datalist id="cities">
    <option value="Mumbai">
    <option value="Delhi">
    <option value="Bangalore">
    <option value="Chennai">
  </datalist>

  <label>Food</label>
  <input list="food" placeholder="Select a food">
  <datalist id="food">
    <option value="Pizza">
    <option value="Burger">
    <option value="Pasta">
    <option value="Salad">
  </datalist>
</body>
</html>
