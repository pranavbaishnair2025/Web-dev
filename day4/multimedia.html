<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
  <!-- video in mp4 (mp4 is prefered) , mp4 for video and mp3 for audio-->
   <!-- for videos its copy video link but for images its copy image address -->
  <video controls height="300" width="400" autoplay loop>
    <source src="https://www.pexels.com/download/video/34202847/" type="video/mp4">
  </video>
  <!-- we can remove controls tag now so vid gets played again and again with no user control -->
  <!-- <video src=""></video> we can write it like this also but wht we used is standard -->

  <!-- audio in mp3, use pixabay website-->
  <!-- we hv to download the audio and save it in same folder -->
  <audio controls autoplay>
    <source src="./the_mountain-concentration-peace-380686.mp3" type="audio/mp3">
  </audio>
</body>
</html>
