<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box{
      border: 2px solid black;
      width: 100px;
      height: 100px;
      text-align: center;
      font-weight: bold;
      background-color: lightblue;
    }

    .product{
      background-color: aqua;
      display: flex;
      /* flex by default gives row format */
      height: 250px;
      flex-direction: row; /*no need to mention this since default is already row*/
      justify-content: center;
      gap: 20px;
      align-items: center;
    }
    /* flexboxfroggy.com is a game to learn flexbox in fun way */
  </style>
</head>
<body>
  <!-- flex is used for 1d display (row or column)  -->
  <div class="product">
    <div class="box">Cake</div>
    <div class="box">Cookie</div>
    <div class="box">Pastry</div>
  </div>
</body>
</html>
