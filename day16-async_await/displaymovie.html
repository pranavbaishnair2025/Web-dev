<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .movie{
      border: 1px solid black;
      border-radius: 12px;
      max-width: 500px;
      margin: auto;
      padding: 10px;
      background-color: white;
    }

    .movie:hover{
      transform: scale(1.03);
      transition: 2s;
      box-shadow: 2px 4px 8px black;
    }
  </style>
</head>
<body>
  <h1>Movie Details</h1>
  <input type="text" id="movieinput" placeholder="enter movie name">
  <button onclick="handlesearch()">Search movie</button>
  <div class="movie" id="moviecontainer">

  </div>
  
  <script>
     async function getmovie(moviename){
      //async functions helps handle multiple tasks at the same time
      //getting data from api
      let url=`http://www.omdbapi.com/?t=${moviename}&apikey=7e753fd7`
      // we put $ and {} for movie name since its a parameter now
      try{
        //getting data from api
        let response=await fetch(url)
        let data=await response.json()
        console.log(data)
        if(data.Response=="True"){
          const moviecontainer=document.getElementById("moviecontainer")
          moviecontainer.innerHTML=`
          <img src="${data.Poster}" style="width:100% ; height: 200px; object-fit:cover">
          <h2>${data.Title}</h2>
          <p>${data.Plot}</p>
          <p>${data.Year}</p>
          `
        }
        else{
          alert("movie not found")
        }
      }catch(error){
        console.log("error fetching",error)
      }
    }
    function handlesearch(){
      const moviename=document.getElementById("movieinput").value
      if(moviename){
        getmovie(moviename)
      }
    }
    // there is some mistake which isnt producing req output 
  </script>
</body>
</html>
