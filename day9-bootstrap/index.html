<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- the first css link is added here -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .carousel-item{
      height: 500px;
      object-fit: cover;
    }

     /* the above code is added to make the carousel images of fixed height and not change according to the device  */
     /* this is because in bootstrap class name holds all the css properties  */
     /* so if we want to change any property we have to override it by writing our own css code  */
  </style>
</head>
<body>
  <!-- /*getbootstrap.com is a great resource for pre-designed components and styles that can be easily integrated into your projects. */ -->
  <!-- /*It offers a wide range of responsive design elements, such as navigation bars, buttons, forms, and grid systems, which can help you create visually appealing and functional websites quickly. */ -->
  <!-- /*By using Bootstrap, you can save time on styling and focus more on the content and functionality of your site.*/ -->
  <h1>Hello bootstrap</h1>
  <div style="background-color: red;" class="abc">
    Hello normal div
  </div>

  <div style="background-color: blue;" class="container">
    <!-- u will notice the blue part changes acc to device (this is because of the name of class container) -->
     <!-- this is because in bootstrap class name holds all the css properties -->
    Hello bootstrap div
  </div>
  <!-- the below line is copy pasted from the website under buttons  -->
  <button type="button" class="btn btn-danger">Danger</button>
  <!-- the below nav tag entirely is also copy pasted from the website -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Navbar</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#">Link</a>
        </li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
            Dropdown
          </a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Action</a></li>
            <li><a class="dropdown-item" href="#">Another action</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><a class="dropdown-item" href="#">Something else here</a></li>
          </ul>
        </li>
        <li class="nav-item">
          <a class="nav-link disabled" aria-disabled="true">Disabled</a>
        </li>
      </ul>
      <form class="d-flex" role="search">
        <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search"/>
        <button class="btn btn-outline-success" type="submit">Search</button>
      </form>
    </div>
  </div>
</nav>
<!-- below is the code for the carousel which is also copy pasted from the website   -->
  <div id="carouselExample" class="carousel slide">
  <div class="carousel-inner" style="height: 500px;">
    <div class="carousel-item active">
      <img src="https://images.pexels.com/photos/34944274/pexels-photo-34944274.jpeg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="https://images.pexels.com/photos/29252368/pexels-photo-29252368.jpeg" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="https://images.pexels.com/photos/18470970/pexels-photo-18470970.jpeg" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
    <span class="carousel-control-next-icon" aria-hidden="true"></span>
    <span class="visually-hidden">Next</span>
  </button>
</div>
  <!-- the next js link is added here  -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
