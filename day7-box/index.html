<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .product{
      border: 2px solid black;
      width: 250px;
      text-align: center;
      border-radius: 10px;
      padding: 10px;
      margin: 10px;
      background-color: brown;
      box-shadow: 5px 5px 10px black;
       /* the above line is for shadow effect on the product box */
    }

    .product:hover{
      box-shadow: 5px 5px 10px blue;
      transition: 2s;
    }

    .product img{
      width: 100%;
      height: 200px;
      object-fit: cover;
      /* the above line is so the image fits perfectly in div container without stretching it */
      border-radius: 10px;
      border: 2px solid white;
    }

    .product button{
      background-color: orange;
      color: black;
      border: none;
      padding: 10px;
      border-radius: 10px; 
    }

    .product h2{
      color: white;
    }

    .product p{
      color: white;
    }

    body{
      display: flex;
      /* this displays the products in row format */
      flex-wrap: wrap;
      /* this line auto responds according to device */
    }
  </style>
</head>
<body>
  <!-- for images we can use unsplash.com and for icons we can use fontawesome.com -->
  <div class="product">
    <img src="https://images.pexels.com/photos/20130929/pexels-photo-20130929.jpeg" >
    <h2>Filter coffee</h2>
    <p>Rs. 199.00</p>
    <button>Buy now</button>
  </div>

  <div class="product">
    <img src="https://images.pexels.com/photos/298485/pexels-photo-298485.jpeg" >
    <h2>Cookie</h2>
    <p>Rs. 150.00</p>
    <button>Buy now</button>
  </div>

  <div class="product">
    <img src="https://images.pexels.com/photos/14105/pexels-photo-14105.jpeg" >
    <h2>Cupcake</h2>
    <p>Rs. 200.00</p>
    <button>Buy now</button>
  </div>

  <div class="product">
    <img src="https://images.pexels.com/photos/34541593/pexels-photo-34541593.jpeg" >
    <h2>Cold coffee</h2>
    <p>Rs. 180.00</p>
    <button>Buy now</button>
  </div>
</body>
</html>
