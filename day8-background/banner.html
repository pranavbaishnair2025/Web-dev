<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .banner{
      border: 2px solid black;
      height: 500px;
      text-align: center;
      color: white;
      text-shadow: 0px 5px 5px blue;
      font-size: 30px;

      /* background properties */
      background-color: bisque;
      background-image: url("https://images.pexels.com/photos/34998667/pexels-photo-34998667.jpeg");
      background-size: cover;
      background-position: center;
      /* sometimes when u take img from google it gets repeated multiple times so to avoid that we use background-repeat property */
      /* this can affect the quality of pic tho so its better to take from proper websites for pics */

    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>Cafe Coffee Day</h1>
  </div>
</body>
</html>
