<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body{
      background-color: beige;
      color: white;
      font-family: cursive;
      text-shadow: 0px 5px 5px red;
      text-align: center;

      background-image: url("https://images.pexels.com/photos/2726370/pexels-photo-2726370.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      /* the above line is just for formality */
      background-attachment: fixed;
       /* the above line is to fix the background image when we scroll down the page */
    }
  </style>
</head>
<body>
  <!-- choosing body tag to style is a way to choose entire webpage -->
   <h1>Welcome to my website</h1>
   <div style="height: 800px">
    <h1>Netflix , Chill</h1>
    <p>Watch anywhere and anytime</p>
   </div>
</body>
</html>
