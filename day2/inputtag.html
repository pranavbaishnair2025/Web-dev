<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- input from user -->
   <!-- default type for input is text, we can also specify it as type="text" -->
   <label>Username</label>
   <input type="text" placeholder="Enter your username">
   <label>Email</label>
   <input type="email" placeholder="Enter your email">
   <label>Password</label>
   <input type="password" placeholder="Enter your password">
   <label>DOB</label>
   <input type="date" placeholder="Enter your DOB">
   <label>Resume</label>
   <input type="file" placeholder="Upload your resume">
   <br>
   <label>Phone Number</label>
   <input type="tel" placeholder="Enter your phone number">

   <!-- this is for multiple lines of input -->
    <label>Message</label>
   <textarea rows="15" cols="40" placeholder="Feedback"></textarea>
</body>
</html>
